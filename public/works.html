    <main>

      <section class="selected" aria-label="プロジェクト一覧">
        <div class="filters" aria-label="作品フィルター">
          <div class="filter-group" aria-label="カテゴリー">
            <span>Category /</span>
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="writing" aria-pressed="false">Writing</button>
            <button class="filter-button" type="button" data-filter="direction" aria-pressed="false">Direction</button>
            <button class="filter-button" type="button" data-filter="community" aria-pressed="false">Community</button>
            <button class="filter-button" type="button" data-filter="exhibition" aria-pressed="false">Exhibition</button>
            <button class="filter-button" type="button" data-filter="publishing" aria-pressed="false">Publishing</button>
            <button class="filter-button" type="button" data-filter="workshop" aria-pressed="false">Workshop</button>
          </div>
          <div class="filter-group" aria-label="年">
            <span>Year /</span>
            <button class="filter-button is-active" type="button" data-year="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-year="2026" aria-pressed="false">2026</button>
            <button class="filter-button" type="button" data-year="2025" aria-pressed="false">2025</button>
            <button class="filter-button" type="button" data-year="2024" aria-pressed="false">2024</button>
            <button class="filter-button" type="button" data-year="2023" aria-pressed="false">2023</button>
            <button class="filter-button" type="button" data-year="2022" aria-pressed="false">2022</button>

        <div class="project-list">
          <a class="project-row" href="./work-yohaku.html" data-tags="writing direction" data-year="2026">

            <span class="project-meta">2026</span>

            <span class="project-name">Civic Question Archive</span>
            <span class="project-meta">2025</span>

    <footer class="footer">

    <script src="./menu.js?v=20260505-home-images-about-clean-v1"></script>
  <script>
      const active = { tag: "all", year: "all" };
      const rows = Array.from(document.querySelectorAll(".project-row"));
      const buttons = Array.from(document.querySelectorAll(".filter-button"));

      function updateWorks() {
        rows.forEach((row) => {
          const tags = row.dataset.tags.split(" ");
          const tagMatch = active.tag === "all" || tags.includes(active.tag);
          const yearMatch = active.year === "all" || row.dataset.year === active.year;
          const dimmed = !(tagMatch && yearMatch);
          row.classList.toggle("is-dimmed", dimmed);
        });
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const group = button.dataset.filter ? "filter" : "year";
          const selector = group === "filter" ? "[data-filter]" : "[data-year]";
          document.querySelectorAll(selector).forEach((item) => {
            item.classList.remove("is-active");
            item.setAttribute("aria-pressed", "false");
          });
          button.classList.add("is-active");
          button.setAttribute("aria-pressed", "true");
          active[group === "filter" ? "tag" : "year"] =
            group === "filter" ? button.dataset.filter : button.dataset.year;
          updateWorks();
        });
      });
    </script>
  </body>
</html>
